name: Orbit
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Orbit:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Orbit
    dependencies:
      - target: OrbitSharing
        embed: true
      - target: OrbitShare
        embed: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Sharing.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: switch-server
            UIApplicationShortcutItemTitle: Switch server
            UIApplicationShortcutItemIconSymbolName: server.rack
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Orbit uses the camera when you take a photo or video to attach.
        NSMicrophoneUsageDescription: Orbit uses the microphone when you record a video to attach.
  OrbitSharing:
    type: framework
    platform: iOS
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).sharing
        GENERATE_INFOPLIST_FILE: true
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  OrbitShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    dependencies:
      - target: OrbitSharing
        embed: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Sharing.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).share
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
    info:
      path: build/ShareInfo.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: OrbitShare.ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
