<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  form { width: min(360px, 90vw); display: grid; gap: 12px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0; opacity: .7; font-size: 14px; }
  input { font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid #8886; background: Field; color: FieldText; }
  button { font: inherit; padding: 9px 10px; border-radius: 8px; border: 0; background: #4f46e5; color: white; cursor: pointer; }
  #error { color: #dc2626; min-height: 1.2em; font-size: 14px; opacity: 1; }
</style>
</head>
<body>
<form id="form">
  <h1>Orbit</h1>
  <p>Enter the address of your team's Orbit server.</p>
  <input id="url" placeholder="orbit.example.com" autofocus autocomplete="url" spellcheck="false" value="__ORBIT_SERVER__">
  <p id="error" role="alert"></p>
  <button type="submit">Continue</button>
</form>
<script>
  window.showError = (text) => { document.getElementById('error').textContent = text }
  document.getElementById('form').addEventListener('submit', (event) => {
    event.preventDefault()
    window.ipc.postMessage(JSON.stringify({ kind: 'server', url: document.getElementById('url').value }))
  })
</script>
</body>
</html>
