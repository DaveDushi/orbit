<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit</title>
<!-- Shown before the server's pages: it checks that the server answers, then loads it. Without a connection
     (autostart at sign-in before the network is up, a wrong address) it says so, tries again by itself and
     offers Change server, instead of the web view's error page that never retries. -->
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  main { width: min(380px, 90vw); display: grid; gap: 12px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0; opacity: .7; font-size: 14px; }
  .buttons { display: flex; gap: 8px; margin-top: 8px; }
  button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid #8886; background: transparent; color: inherit; cursor: pointer; }
  button.primary { border: 0; background: #4f46e5; color: white; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="waiting" hidden>
  <p>Connecting to <span class="host"></span>…</p>
</main>
<main id="offline" hidden>
  <h1>Cannot reach <span class="host"></span></h1>
  <p>Check your internet connection. Orbit tries again by itself<span id="when"></span>.</p>
  <div class="buttons">
    <button class="primary" id="retry" type="button">Try again</button>
    <button id="server" type="button">Change server</button>
  </div>
</main>
<script>
  const SERVER = __ORBIT_SERVER__
  const post = (message) => window.ipc.postMessage(JSON.stringify(message))
  for (const el of document.querySelectorAll('.host')) el.textContent = new URL(SERVER).host
  // A fast server never shows the "Connecting" line.
  const slow = setTimeout(() => { document.getElementById('waiting').hidden = false }, 600)
  let delay = 2000
  let timer = 0
  let failures = 0

  async function probe() {
    clearTimeout(timer)
    const abort = new AbortController()
    const limit = setTimeout(() => abort.abort(), 10000)
    try {
      // Any answer counts (also the gateway's redirect to its sign-in): the server is there.
      await fetch(SERVER + '/', { mode: 'no-cors', cache: 'no-store', credentials: 'omit', signal: abort.signal })
      clearTimeout(limit)
      if (failures) post({ kind: 'log', text: `connect: reached the server after ${failures} failed tries` })
      location.replace(SERVER)
      return
    } catch {
      clearTimeout(limit)
    }
    failures += 1
    if (failures === 1) post({ kind: 'log', text: 'connect: cannot reach the server, retrying' })
    clearTimeout(slow)
    document.getElementById('waiting').hidden = true
    document.getElementById('offline').hidden = false
    document.getElementById('when').textContent = ` in ${Math.round(delay / 1000)} seconds`
    timer = setTimeout(probe, delay)
    delay = Math.min(delay * 2, 30000)
  }

  document.getElementById('retry').addEventListener('click', () => {
    delay = 2000
    document.getElementById('when').textContent = ''
    probe()
  })
  document.getElementById('server').addEventListener('click', () => post({ kind: 'action', name: 'server' }))
  window.addEventListener('online', () => probe())
  probe()
</script>
</body>
</html>
