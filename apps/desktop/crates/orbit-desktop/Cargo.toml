[package]
name = "orbit-desktop"
description = "The Orbit desktop app: the server's web UI in a native window (wry), with a tray, notifications and an unread badge."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
orbit-client = { path = "../orbit-client" }
# The main window and the gateway sign-in window: a system web view (WebView2, WKWebView,
# WebKitGTK). Linux needs libwebkit2gtk-4.1-dev to build.
wry = "0.57"
tao = "0.37"
# The tray icon and its menu. Linux loads libayatana-appindicator3 (or libappindicator3) at run time.
tray-icon = "0.26"
# OS notifications: D-Bus on Linux, NSUserNotification on macOS, toasts on Windows.
notify-rust = "4.19"
# Decodes the embedded app icon.
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
rpassword = "7"
# External links in the default browser (ShellExecute, `open`, `xdg-open`).
open = "5"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
# The console of command-line uses, the "Start with Windows" entry in the registry, the
# AppUserModelID (toast sender, taskbar group) and the foreground hand-off of a second start.
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# Windows: the Orbit icon and version info in Orbit.exe (Explorer, taskbar, Start menu).
winresource = "0.1"
