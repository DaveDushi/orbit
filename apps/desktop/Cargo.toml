# The desktop client is its own workspace: GPUI's dependency tree and toolchain move apart from
# the server's, so it keeps its own Cargo.lock and target/ (see apps/desktop/README.md).
[workspace]
resolver = "3"
members = ["crates/orbit-client", "crates/orbit-store", "crates/orbit-desktop"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
# GPUI (Zed's UI framework) and gpui-component (Longbridge) through their one facade crate,
# `gpui-kit`, pinned to one git rev (tag v0.9.1, 2026-11-09). That rev pins GPUI itself to the exact
# crates.io snapshot `gpui-pre =0.3.12` (gpui-kit's `Cargo.toml`), which Cargo.lock records.
# Bump the rev on purpose only, with its Cargo.lock entry.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "39ab849a93b5f15507b969164d49891db8d5b470" }
async-channel = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# HTTP and sockets: blocking, on their own threads (the UI is GPUI's; no tokio runtime needed).
# rustls with ring only: aws-lc needs cmake, and one TLS stack is enough.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[profile.dev.package."*"]
debug = false
