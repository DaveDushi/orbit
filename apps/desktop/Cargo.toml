# The desktop client is its own workspace: its web view and tray dependency tree and toolchain move
# apart from the server's, so it keeps its own Cargo.lock and target/ (see apps/desktop/README.md).
[workspace]
resolver = "3"
members = ["crates/orbit-client", "crates/orbit-desktop"]

[workspace.package]
edition = "2024"
version = "0.1.2"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# HTTP and sockets: blocking, on their own threads (no tokio runtime needed).
# rustls with ring only: aws-lc needs cmake, and one TLS stack is enough.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[profile.dev.package."*"]
debug = false
