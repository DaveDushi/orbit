name: Desktop

# The Orbit desktop app (apps/desktop: the server's web UI in a wry window, with a tray, notifications
# and an unread badge): tests on Linux, a Windows installer and zip (unsigned, the main target) and a macOS
# .app/.dmg (ad-hoc signed, not notarized; only when asked), plus `latest.json` for the app's update check.
# Run by hand, or push a tag `desktop-v<version>` (macOS minutes cost 10×: no build on every push).
# deploy/desktop-downloads.sh copies the files to the server's /downloads/desktop/.
on:
  workflow_dispatch:
    inputs:
      server:
        description: Server that hosts the downloads (latest.json links to <server>/downloads/desktop/)
        default: https://orbit.wellrox.com
      macos:
        description: Also build the macOS .dmg (parked; Windows is the target)
        type: boolean
        default: false
  push:
    tags: ["desktop-v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop

env:
  CARGO_TERM_COLOR: always
  # The toolchain of apps/desktop/rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.99.1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop
      - name: Linux libraries (wry's WebKitGTK, the tray's appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config
      - run: cargo test --workspace --locked
      - name: --check-gateway against the fake server
        run: |
          cargo build -p orbit-desktop --locked
          scripts/check-gateway-smoke.sh target/debug/orbit-desktop

  macos:
    if: ${{ inputs.macos }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop
      - run: cargo build --release -p orbit-desktop --locked
      - name: Orbit.app, ad-hoc signed, in a .dmg
        run: |
          version=$(cargo pkgid -p orbit-desktop | sed 's/.*[#@]//')
          app=dist/Orbit.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/orbit-desktop "$app/Contents/MacOS/orbit-desktop"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Ad hoc: no paid Apple account. The first open needs right-click → Open.
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          ln -s /Applications dist/Applications
          hdiutil create -volname Orbit -srcfolder dist -ov -format UDZO "Orbit-$version-macos-arm64.dmg"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The packaged binary starts and runs --check-gateway
        run: |
          dist/Orbit.app/Contents/MacOS/orbit-desktop --version
          scripts/check-gateway-smoke.sh dist/Orbit.app/Contents/MacOS/orbit-desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-macos
          path: apps/desktop/Orbit-${{ env.VERSION }}-macos-arm64.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop
      - run: cargo build --release -p orbit-desktop --locked
      - name: Orbit zip (unsigned; SmartScreen warns on first start)
        shell: bash
        run: |
          version=$(cargo pkgid -p orbit-desktop | sed 's/.*[#@]//')
          mkdir -p dist/Orbit
          cp target/release/orbit-desktop.exe dist/Orbit/Orbit.exe
          cp packaging/windows/README.txt dist/Orbit/
          (cd dist && 7z a "../Orbit-$version-windows-x64.zip" Orbit)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The packaged binary starts and runs --check-gateway
        shell: bash
        run: |
          dist/Orbit/Orbit.exe --version
          PYTHON=python scripts/check-gateway-smoke.sh dist/Orbit/Orbit.exe
      # Per user (no admin), Start-menu and optional desktop shortcut, uninstaller. Inno Setup 6 is
      # on the windows-2025 image (images/windows/Windows2025-Readme.md in actions/runner-images);
      # Chocolatey installs it if a later image drops it.
      - name: Orbit installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceExe=$PWD\dist\Orbit\Orbit.exe" "/O$PWD" packaging\windows\orbit.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The installer installs per user and uninstalls
        shell: pwsh
        run: |
          $setup = "Orbit-$env:VERSION-windows-x64-setup.exe"
          Start-Process -Wait -FilePath ".\$setup" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $app = "$env:LOCALAPPDATA\Programs\Orbit"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Orbit.lnk"
          if (-not (Test-Path "$app\Orbit.exe")) { throw "Orbit.exe is not in $app" }
          if (-not (Test-Path $lnk)) { throw "no Start-menu shortcut at $lnk" }
          & "$app\Orbit.exe" --version | Out-Host
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          # The uninstaller runs on from a temp copy: wait for it.
          for ($i = 0; $i -lt 30 -and (Test-Path $lnk); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $lnk) { throw "the uninstaller left the Start-menu shortcut" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows
          path: |
            apps/desktop/Orbit-${{ env.VERSION }}-windows-x64-setup.exe
            apps/desktop/Orbit-${{ env.VERSION }}-windows-x64.zip

  # latest.json for the app's update check: deploy/desktop-downloads.sh copies it and the files to the
  # server's downloads/desktop/ folder (served by nginx, behind the gateway like the rest).
  # Windows only is enough: the macOS fields are left out when that job did not run.
  manifest:
    needs: [macos, windows]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.macos.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: apps/desktop/artifacts
      - name: latest.json
        env:
          SERVER: ${{ inputs.server || 'https://orbit.wellrox.com' }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          setup=$(basename artifacts/desktop-windows/*-setup.exe)
          zip=$(basename artifacts/desktop-windows/*.zip)
          base="${SERVER%/}/downloads/desktop"
          # `windows` (the app's update link) is the installer: it updates the installed app in place.
          jq -n --arg v "$version" --arg win "$base/$setup" --arg zip "$base/$zip" \
            --arg win_sha "$(sha256sum artifacts/desktop-windows/$setup | cut -d' ' -f1)" \
            --arg zip_sha "$(sha256sum artifacts/desktop-windows/$zip | cut -d' ' -f1)" \
            '{version: $v, notes: "", windows: $win, windows_zip: $zip,
              sha256: {windows: $win_sha, windows_zip: $zip_sha}}' > latest.json
          if dmg=$(ls artifacts/desktop-macos/*.dmg 2>/dev/null); then
            jq --arg mac "$base/$(basename "$dmg")" --arg mac_sha "$(sha256sum "$dmg" | cut -d' ' -f1)" \
              '.macos = $mac | .sha256.macos = $mac_sha' latest.json > latest.tmp && mv latest.tmp latest.json
          fi
          cat latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-latest-json
          path: apps/desktop/latest.json
