table inet orbitspike {
  chain input {
    type filter hook input priority -10; policy accept;
    iifname "sbxh*" ip daddr 10.200.0.0/16 tcp dport 3128 accept
    iifname "sbxh*" counter drop
  }
  chain forward {
    type filter hook forward priority -10; policy accept;
    iifname "sbxh*" counter drop
    oifname "sbxh*" counter drop
  }
}
