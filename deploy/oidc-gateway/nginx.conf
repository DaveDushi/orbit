# The public door for Cloudflare Access (docs/apps.md), behind cloudflared on this machine: only
# the two calls its servers make.
# Everything else, Orbit's login and API included, gets a 404 without reaching Orbit.
# Run as its own process (orbit-oidc-gateway.service), apart from any other nginx.
daemon off;
worker_processes 1;
pid gateway.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    # No access log: nothing about a request can land on disk. Error lines name only allowed paths.
    access_log off;

    # The raw request line, before nginx decodes or normalizes it. So /oauth/%2e%2e/api,
    # /oauth/../api, /oauth/token/, //oauth/token and any query string simply do not match.
    # Regular expressions, because plain strings in a map ignore case (/OAUTH/TOKEN would pass).
    map "$request_method $request_uri" $gateway_allowed {
        default 0;
        "~^POST /oauth/token$" 1;
        "~^GET /oauth/jwks$" 1;
    }

    # Who Orbit's rate limit counts. Cloudflare's edge sets this header on what it sends through
    # the tunnel. X-Forwarded-For is ignored: Cloudflare keeps what the caller wrote in it. Without
    # a valid single address, the request counts as this connection: all such requests share one limit.
    map $http_cf_connecting_ip $gateway_client {
        default $remote_addr;
        "~^[0-9A-Fa-f:.]+$" $http_cf_connecting_ip;
    }

    # In memory only: a client secret in a body never goes to a temporary file.
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    proxy_temp_path proxy_temp;
    client_body_temp_path client_body_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    server {
        # Loopback only: cloudflared calls it from this machine.
        listen 127.0.0.1:8400;

        if ($gateway_allowed = 0) {
            return 404;
        }

        location / {
            # An allow-list: no cookie, Origin, X-ExeDev-* or any header nobody knows about yet.
            proxy_pass_request_headers off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host orbit-oidc-gateway;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Authorization $http_authorization;
            # The only values Orbit reads from a trusted proxy. The exe.dev proxy ends TLS.
            proxy_set_header X-Forwarded-For $gateway_client;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://127.0.0.1:8080$request_uri;
        }
    }
}
